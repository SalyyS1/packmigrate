name: 'Packmigrate Resource Pack Migrator'
description: 'Migrate legacy Minecraft CustomModelData overrides to 1.21.4 through 26.3+ item model definitions with SARIF v2.1.0 diagnostics.'
author: 'Salyvn'
branding:
  icon: 'refresh-cw'
  color: 'purple'

inputs:
  args:
    description: 'Arguments passed to packmigrate (for example: "legacy-pack.zip --versions 1.20.1..26.3 --zip migrated-pack.zip --strict")'
    required: true
  sarif:
    description: 'Optional output path for an OASIS SARIF v2.1.0 migration audit report'
    required: false
    default: ''
  version:
    description: 'Packmigrate release tag to download (defaults to v0.4.0)'
    required: false
    default: 'v0.4.0'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF v2.1.0 report when the sarif input is set'
    value: ${{ inputs.sarif }}

runs:
  using: 'composite'
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Download and run packmigrate
      shell: bash
      env:
        PACKMIGRATE_VERSION: ${{ inputs.version }}
        PACKMIGRATE_ARGS: ${{ inputs.args }}
        PACKMIGRATE_SARIF: ${{ inputs.sarif }}
      run: |
        set -euo pipefail
        VER="${PACKMIGRATE_VERSION#v}"
        CACHE_DIR="${RUNNER_TEMP:-/tmp}/packmigrate-${VER}"
        mkdir -p "$CACHE_DIR"
        JAR="$CACHE_DIR/packmigrate.jar"
        if [ ! -f "$JAR" ]; then
          curl -fsSL -o "$JAR" \
            "https://github.com/SalyyS1/packmigrate/releases/download/v${VER}/packmigrate.jar"
        fi
        SARIF_ARG=""
        if [ -n "$PACKMIGRATE_SARIF" ]; then
          SARIF_ARG="--sarif $PACKMIGRATE_SARIF"
        fi
        # shellcheck disable=SC2086
        java -jar "$JAR" $PACKMIGRATE_ARGS $SARIF_ARG
