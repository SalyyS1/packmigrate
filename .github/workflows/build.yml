name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew build --no-daemon

      - name: The CLI runs and describes itself
        run: |
          set -euo pipefail
          java -jar build/libs/packmigrate.jar --version
          java -jar build/libs/packmigrate.jar --help

      - name: the fixture pack converts to directory, deterministic zip, and SARIF v2.1.0
        run: |
          set -euo pipefail
          cp -r src/test/resources/legacypack /tmp/pack
          set +e
          java -jar build/libs/packmigrate.jar /tmp/pack --write --zip /tmp/pack.zip --sarif /tmp/packmigrate.sarif > /tmp/out.txt 2>&1
          code=$?
          set -e
          cat /tmp/out.txt
          test "$code" = "1" || { echo "expected exit code 1, got $code"; exit 1; }
          grep -q "void_sword" /tmp/out.txt
          grep -q "resource-pack-sha1=" /tmp/out.txt
          test -f /tmp/pack/assets/minecraft/items/bow.json
          test -f /tmp/pack/assets/minecraft/items/compass.json
          test -f /tmp/pack/assets/minecraft/items/paper.json
          jq -e '.version == "2.1.0" and .runs[0].tool.driver.name == "packmigrate"' /tmp/packmigrate.sarif
          jq -e '[.runs[0].results[].ruleId] | index("PM003") != null and index("PM006") != null and index("PM007") != null' /tmp/packmigrate.sarif
          jq -e '.runs[0].results[0].locations[0].physicalLocation.artifactLocation.uriBaseId == "%SRCROOT%"' /tmp/packmigrate.sarif

      - name: zip input, 26.3 range, overlay isolation, and json report work end-to-end
        run: |
          set -euo pipefail
          set +e
          java -jar build/libs/packmigrate.jar /tmp/pack.zip --versions 1.20.1..26.3 --overlay-items overlay_1214 --json > /tmp/plan.json
          set -e
          jq -e '.itemsMigrated == 4 and .errorCount == 1 and .maxFormat == "97" and .overlayItemsDir == "overlay_1214"' /tmp/plan.json

      - name: the bow definition has the shape vanilla uses
        run: |
          set -euo pipefail
          BOW=/tmp/pack/assets/minecraft/items/bow.json
          jq -e '.model.fallback.type == "minecraft:condition"' $BOW
          jq -e '.model.fallback.property == "minecraft:using_item"' $BOW
          jq -e '.model.fallback.on_true.property == "minecraft:use_duration"' $BOW
          jq -e '.model.fallback.on_true.scale == 0.05' $BOW
          jq -e '[.model.fallback.on_true.entries[].threshold] == [0.65, 0.9]' $BOW
          jq -e '.model.fallback.on_true.fallback.model == "minecraft:item/bow_pulling_0"' $BOW

      - name: the compass definition aims where the legacy predicate aimed
        run: |
          set -euo pipefail
          C=/tmp/pack/assets/minecraft/items/compass.json
          jq -e '.model.property == "minecraft:has_component"' $C
          jq -e '.model.component == "minecraft:lodestone_tracker"' $C
          jq -e '.model.on_true.target == "lodestone"' $C
          jq -e '.model.on_false.target == "spawn"' $C

      - name: a custom_model_data value that needs a second predicate falls back the way it used to
        run: |
          set -euo pipefail
          P=/tmp/pack/assets/minecraft/items/paper.json
          jq -e '.model.property == "minecraft:custom_model_data"' $P
          jq -e '[.model.entries[].threshold] == [1, 2, 3]' $P
          jq -e '.model.entries[2].model.property == "minecraft:main_hand"' $P
          jq -e '.model.entries[2].model.cases[0].when == "left"' $P
          jq -e '.model.entries[2].model.fallback.model == "myserver:item/map_fragment"' $P

      - name: pack mcmeta satisfies both eras up to 26.3 (format 97)
        run: |
          set -euo pipefail
          M=/tmp/pack/pack.mcmeta
          jq -e '.pack.pack_format == 46' $M
          jq -e '.pack.supported_formats == [46, 64]' $M
          jq -e '.pack.min_format == 46' $M
          jq -e '.pack.max_format == 97' $M
          jq -e '.pack.description == "myserver \"custom\" items"' $M

      - name: a second run over the converted pack changes nothing
        run: |
          set -euo pipefail
          cp -r /tmp/pack /tmp/pack-again
          set +e
          java -jar build/libs/packmigrate.jar /tmp/pack-again --write > /tmp/again.txt 2>&1
          set -e
          cat /tmp/again.txt
          diff -r /tmp/pack /tmp/pack-again

      - name: v0.5.0 component codegen, predicate tree simplification, and dual-era bundle export work end-to-end
        run: |
          set -euo pipefail
          set +e
          java -jar build/libs/packmigrate.jar src/test/resources/legacypack \
            --versions 1.21.6..26.3 \
            --simplify-trees --codegen-components \
            --component-manifest /tmp/components-263.json \
            --bundle-export /tmp/bundle-v050 \
            --sarif /tmp/v050.sarif --json > /tmp/v050-report.json
          set -e
          jq -e '.standaloneDefinitionCount >= 4 and .bundleManifest.modernSlice.maxFormat == "97.1"' /tmp/v050-report.json
          jq -e '.runs[0].tool.driver.rules | length == 20' /tmp/v050.sarif
          jq -e '.entryCount >= 4 and (.entries[0].giveCommand26_3 | startswith("/give @s "))' /tmp/components-263.json
          test -f /tmp/bundle-v050/pack-legacy-1_20_1-1_21_3.zip
          test -f /tmp/bundle-v050/pack-modern-1_21_4-26_3.zip
          test -f /tmp/bundle-v050/pack-hybrid-universal.zip
          test -f /tmp/bundle-v050/bundle-manifest.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: packmigrate-jar
          path: build/libs/packmigrate.jar
          if-no-files-found: error
